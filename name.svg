<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* Анимация переливания градиента */
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* Анимация падения снежинок */
        @keyframes snowflakes {
          0% {
            transform: translateY(-10px) rotate(0deg);
            opacity: 0;
          }
          20% { opacity: 0.8; }
          100% {
            transform: translateY(200px) rotate(360deg);
            opacity: 0;
          }
        }

        .container {
          position: relative;
          width: 100%;
          height: 180px;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          background: transparent;
        }

        .gradient-text {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-weight: 900;
          font-size: 64px;
          /* Градиент текста */
          background: linear-gradient(-45deg, #e01cd5, #1fddff, #7928ca, #ff0080);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradient 6s ease infinite;
        }

        /* Стили снежинок */
        .snowflake {
          position: absolute;
          top: -10px;
          color: #fff;
          font-size: 16px;
          user-select: none;
          animation: snowflakes 4s linear infinite;
        }

        .sf1 { left: 10%; animation-delay: 0s; font-size: 14px; }
        .sf2 { left: 25%; animation-delay: 1.5s; font-size: 20px; }
        .sf3 { left: 45%; animation-delay: 0.7s; font-size: 12px; }
        .sf4 { left: 70%; animation-delay: 2.2s; font-size: 18px; }
        .sf5 { left: 88%; animation-delay: 1.1s; font-size: 15px; }
      </style>

      <div class="container">
        <!-- Снежинки -->
        <div class="snowflake sf1">❄</div>
        <div class="snowflake sf2">❄</div>
        <div class="snowflake sf3">❄</div>
        <div class="snowflake sf4">❄</div>
        <div class="snowflake sf5">❄</div>

        <!-- Ваш текст -->
        <h1 class="gradient-text">Iliyev Alisher</h1>
      </div>
    </div>
  </foreignObject>
</svg>




<svg fill="none" viewBox="0 0 800 260" width="800" height="260" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* 1. Анимация текста (наклон + пульсация + тень). Без задержек (linear) */
        @keyframes fullMotion {
          0% {
            transform: translateY(0px) scale(1) rotate(0deg);
            filter: drop-shadow(0px 8px 15px rgba(224, 28, 213, 0.75)) 
                    drop-shadow(0px 0px 30px rgba(224, 28, 213, 0.5));
          }
          25% {
            transform: translateY(-5px) scale(1.03) rotate(-3deg);
            filter: drop-shadow(0px 12px 22px rgba(31, 221, 255, 0.85)) 
                    drop-shadow(0px 0px 35px rgba(31, 221, 255, 0.6));
          }
          50% {
            transform: translateY(-10px) scale(1.06) rotate(0deg);
            filter: drop-shadow(0px 18px 28px rgba(121, 40, 202, 0.95)) 
                    drop-shadow(0px 0px 45px rgba(255, 0, 128, 0.7));
          }
          75% {
            transform: translateY(-5px) scale(1.03) rotate(3deg);
            filter: drop-shadow(0px 12px 22px rgba(31, 221, 255, 0.85)) 
                    drop-shadow(0px 0px 35px rgba(31, 221, 255, 0.6));
          }
          100% {
            transform: translateY(0px) scale(1) rotate(0deg);
            filter: drop-shadow(0px 8px 15px rgba(224, 28, 213, 0.75)) 
                    drop-shadow(0px 0px 30px rgba(224, 28, 213, 0.5));
          }
        }

        /* 2. Анимация переливания градиента */
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* 3. Анимация падения снежинок (как в вашем примере) */
        @keyframes snowflakes {
          0% {
            transform: translateY(-10px) rotate(0deg);
            opacity: 0;
          }
          20% { opacity: 0.8; }
          100% {
            transform: translateY(260px) rotate(360deg);
            opacity: 0;
          }
        }

        /* 4. Анимация гирлянды */
        @keyframes garlandBlink {
          0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px transparent); }
          50% { opacity: 1; filter: drop-shadow(0 0 10px currentColor); }
        }

        .container {
          position: relative;
          width: 100%;
          height: 240px;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          background: transparent;
        }

        .gradient-text {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-weight: 900;
          font-size: 62px;
          /* Градиент текста */
          background: linear-gradient(-45deg, #e01cd5, #1fddff, #7928ca, #ff0080);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          /* Обе анимации текста, без задержек */
          animation: gradient 4s linear infinite, fullMotion 4s linear infinite;
          transform-origin: center center;
          z-index: 3;
        }

        /* Стили снежинок (как в вашем примере, только БОЛЬШЕ) */
        .snowflake {
          position: absolute;
          top: -10px;
          color: #fff;
          user-select: none;
          /* Анимация падения */
          animation: snowflakes 4s linear infinite;
          z-index: 2;
        }

        /* Отрицательные задержки (negative delay) для мгновенного старта снегопада */
        .sf1  { left: 3%;  animation-delay: -0.2s; font-size: 14px; animation-duration: 3.8s; }
        .sf2  { left: 8%;  animation-delay: -1.8s; font-size: 22px; animation-duration: 4.5s; }
        .sf3  { left: 14%; animation-delay: -0.9s; font-size: 12px; animation-duration: 3.2s; }
        .sf4  { left: 20%; animation-delay: -2.5s; font-size: 18px; animation-duration: 4.1s; }
        .sf5  { left: 26%; animation-delay: -1.1s; font-size: 15px; animation-duration: 3.5s; }
        .sf6  { left: 32%; animation-delay: -3.0s; font-size: 20px; animation-duration: 4.8s; }
        .sf7  { left: 38%; animation-delay: -0.5s; font-size: 13px; animation-duration: 3.9s; }
        .sf8  { left: 44%; animation-delay: -2.2s; font-size: 24px; animation-duration: 4.2s; }
        .sf9  { left: 50%; animation-delay: -1.4s; font-size: 11px; animation-duration: 3.0s; }
        .sf10 { left: 56%; animation-delay: -2.8s; font-size: 19px; animation-duration: 4.6s; }
        .sf11 { left: 62%; animation-delay: -0.7s; font-size: 16px; animation-duration: 3.7s; }
        .sf12 { left: 68%; animation-delay: -3.3s; font-size: 21px; animation-duration: 4.9s; }
        .sf13 { left: 74%; animation-delay: -1.6s; font-size: 14px; animation-duration: 3.4s; }
        .sf14 { left: 80%; animation-delay: -2.1s; font-size: 23px; animation-duration: 4.3s; }
        .sf15 { left: 86%; animation-delay: -0.4s; font-size: 12px; animation-duration: 3.6s; }
        .sf16 { left: 92%; animation-delay: -2.9s; font-size: 17px; animation-duration: 4.0s; }
        .sf17 { left: 97%; animation-delay: -1.2s; font-size: 20px; animation-duration: 4.4s; }

        /* Новогодний сет-ап */
        .garland { position: absolute; top: 6px; width: 90%; display: flex; justify-content: space-around; z-index: 5; }
        .bulb { width: 10px; height: 10px; border-radius: 50%; animation: garlandBlink 1.2s infinite alternate ease-in-out; }
        .c-red { background: #ff3333; color: #ff3333; animation-delay: 0s; }
        .c-green { background: #33ff33; color: #33ff33; animation-delay: 0.3s; }
        .c-yellow { background: #ffff33; color: #ffff33; animation-delay: 0.6s; }
        .c-blue { background: #33ffff; color: #33ffff; animation-delay: 0.9s; }
        .c-purple { background: #ff33ff; color: #ff33ff; animation-delay: 1.2s; }

        .santa-hat { position: absolute; top: 30px; font-size: 40px; z-index: 4; transform: rotate(-15deg); animation: fullMotion 4s linear infinite; }
        .decor { position: absolute; bottom: 10px; font-size: 32px; z-index: 4; }
        .d-left { left: 20px; }
        .d-right { right: 20px; }
      </style>

      <div class="container">
        <!-- Гирлянда -->
        <div class="garland">
          <div class="bulb c-red"></div><div class="bulb c-green"></div><div class="bulb c-yellow"></div><div class="bulb c-blue"></div><div class="bulb c-purple"></div>
          <div class="bulb c-red"></div><div class="bulb c-green"></div><div class="bulb c-yellow"></div><div class="bulb c-blue"></div><div class="bulb c-purple"></div>
        </div>

        <!-- МНОГО Снежинок (из вашего примера) -->
        <div class="snowflake sf1">❄</div><div class="snowflake sf2">❅</div><div class="snowflake sf3">❆</div>
        <div class="snowflake sf4">❄</div><div class="snowflake sf5">❅</div><div class="snowflake sf6">❆</div>
        <div class="snowflake sf7">❄</div><div class="snowflake sf8">❅</div><div class="snowflake sf9">❆</div>
        <div class="snowflake sf10">❄</div><div class="snowflake sf11">❅</div><div class="snowflake sf12">❆</div>
        <div class="snowflake sf13">❄</div><div class="snowflake sf14">❅</div><div class="snowflake sf15">❆</div>
        <div class="snowflake sf16">❄</div><div class="snowflake sf17">❅</div>

        <!-- Декор -->
        <div class="santa-hat">🎅</div>
        <div class="decor d-left">🎄🎁</div>
        <!-- Ваш текст с полной анимацией -->
        <h1 class="gradient-text">Iliyev Alisher</h1>
        <div class="decor d-right">🎁🎄</div>
      </div>
    </div>
  </foreignObject>
</svg>
