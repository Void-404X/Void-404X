<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* Анимация переливания градиента */
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* Анимация падения снежинок */
        @keyframes snowflakes {
          0% {
            transform: translateY(-10px) rotate(0deg);
            opacity: 0;
          }
          20% { opacity: 0.8; }
          100% {
            transform: translateY(200px) rotate(360deg);
            opacity: 0;
          }
        }

        .container {
          position: relative;
          width: 100%;
          height: 180px;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          background: transparent;
        }

        .gradient-text {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-weight: 900;
          font-size: 64px;
          /* Градиент текста */
          background: linear-gradient(-45deg, #e01cd5, #1fddff, #7928ca, #ff0080);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradient 6s ease infinite;
        }

        /* Стили снежинок */
        .snowflake {
          position: absolute;
          top: -10px;
          color: #fff;
          font-size: 16px;
          user-select: none;
          animation: snowflakes 4s linear infinite;
        }

        .sf1 { left: 10%; animation-delay: 0s; font-size: 14px; }
        .sf2 { left: 25%; animation-delay: 1.5s; font-size: 20px; }
        .sf3 { left: 45%; animation-delay: 0.7s; font-size: 12px; }
        .sf4 { left: 70%; animation-delay: 2.2s; font-size: 18px; }
        .sf5 { left: 88%; animation-delay: 1.1s; font-size: 15px; }
      </style>

      <div class="container">
        <!-- Снежинки -->
        <div class="snowflake sf1">❄</div>
        <div class="snowflake sf2">❄</div>
        <div class="snowflake sf3">❄</div>
        <div class="snowflake sf4">❄</div>
        <div class="snowflake sf5">❄</div>

        <!-- Ваш текст -->
        <h1 class="gradient-text">Iliyev Alisher</h1>
      </div>
    </div>
  </foreignObject>
</svg>



