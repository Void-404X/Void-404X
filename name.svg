<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* 1. Анимация перелива градиента (фоновая) */
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* 2. Анимация движения текста (взлет + zoom + поворот + изменение тени) */
        @keyframes fullMotion {
          0% {
            transform: translateY(0px) scale(1) rotate(0deg);
            filter: drop-shadow(0px 0px 8px rgba(224, 28, 213, 0.4));
          }
          25% {
            transform: translateY(-5px) scale(1.03) rotate(-3deg);
            filter: drop-shadow(0px 0px 18px rgba(31, 221, 255, 0.7));
          }
          50% {
            transform: translateY(-10px) scale(1.06) rotate(0deg);
            filter: drop-shadow(0px 0px 25px rgba(224, 28, 213, 0.9));
          }
          75% {
            transform: translateY(-5px) scale(1.03) rotate(3deg);
            filter: drop-shadow(0px 0px 18px rgba(31, 221, 255, 0.7));
          }
          100% {
            transform: translateY(0px) scale(1) rotate(0deg);
            filter: drop-shadow(0px 0px 8px rgba(224, 28, 213, 0.4));
          }
        }

        /* 3. Анимация падения снежинок */
        @keyframes snowflakes {
          0% {
            transform: translateY(-10px) rotate(0deg);
            opacity: 0;
          }
          20% { opacity: 0.9; }
          100% {
            transform: translateY(230px) rotate(360deg);
            opacity: 0;
          }
        }

        .container {
          position: relative;
          width: 100%;
          height: 220px;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          background: transparent;
        }

        .gradient-text {
          /* ВАЖНО: margin: 0 убирает лишние отступы */
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-weight: 900;
          font-size: 64px;
          
          background: linear-gradient(-45deg, #e01cd5, #1fddff, #7928ca, #ff0080);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          background-clip: text; /* Для совместимости */
          -webkit-text-fill-color: transparent;
          
          /* ВАЖНО: Элемент должен быть inline-block или block для правильной тени */
          display: inline-block;
          
          /* Объединяем две анимации: градиент и движение */
          animation: 
            gradient 4s linear infinite,
            fullMotion 4s linear infinite;
          
          transform-origin: center center;
          will-change: transform, filter;
          
          /* ВАЖНО: z-index, чтобы текст был фоном для снежинок */
          z-index: 1;
        }

        /* Отрицательные задержки (negative delay) - снежинки сразу заполняют весь экран */
        .snowflake {
          position: absolute;
          top: -10px;
          color: #fff;
          user-select: none;
          /* Увеличим z-index, чтобы они были ТОЧНО поверх текста */
          z-index: 10;
          animation: snowflakes 4s linear infinite;
        }

        /* Параметры снежинок */
        .sf1 { left: 10%; animation-delay: 0s; font-size: 14px; }
        .sf2 { left: 25%; animation-delay: -1.5s; font-size: 20px; }
        .sf3 { left: 45%; animation-delay: -0.7s; font-size: 12px; }
        .sf4 { left: 70%; animation-delay: -2.2s; font-size: 18px; }
        .sf5 { left: 88%; animation-delay: -3.1s; font-size: 15px; }
      </style>

      <div class="container">
        <!-- Снежинки (они первыми в коде, но z-index выведет их вперед) -->
        <div class="snowflake sf1">❄</div>
        <div class="snowflake sf2">❄</div>
        <div class="snowflake sf3">❄</div>
        <div class="snowflake sf4">❄</div>
        <div class="snowflake sf5">❄</div>

        <!-- Текст -->
        <h1 class="gradient-text">Iliyev Alisher</h1>
      </div>
    </div>
  </foreignObject>
</svg>

