<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>

        @keyframes gradientText {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* 2. Постоянное движение текста (взлет + zoom + поворот + свечение) */
        @keyframes fullMotion {
          0% {
            transform: translateY(0px) scale(1) rotate(0deg);
            filter: drop-shadow(0px 0px 8px rgba(224, 28, 213, 0.4));
          }
          25% {
            transform: translateY(-5px) scale(1.03) rotate(-3deg);
            filter: drop-shadow(0px 0px 18px rgba(31, 221, 255, 0.7));
          }
          50% {
            transform: translateY(-10px) scale(1.06) rotate(0deg);
            filter: drop-shadow(0px 0px 25px rgba(224, 28, 213, 0.9));
          }
          75% {
            transform: translateY(-5px) scale(1.03) rotate(3deg);
            filter: drop-shadow(0px 0px 18px rgba(31, 221, 255, 0.7));
          }
          100% {
            transform: translateY(0px) scale(1) rotate(0deg);
            filter: drop-shadow(0px 0px 8px rgba(224, 28, 213, 0.4));
          }
        }

        /* 3. Двойная анимация снежинок: падение + покачивание в стороны */
        @keyframes snowflakes-fall {
          0% { top: -10%; }
          100% { top: 100%; }
        }

        @keyframes snowflakes-shake {
          0% { transform: translateX(0px); }
          50% { transform: translateX(60px); }
          100% { transform: translateX(0px); }
        }

        .container {
          position: relative;
          width: 100%;
          height: 240px;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
          background: transparent;
        }

        .gradient-text {
          margin: 0;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          font-weight: 900;
          font-size: 64px;
          
          background: linear-gradient(-45deg, #e01cd5, #1fddff, #7928ca, #ff0080);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          
          display: inline-block;
          animation: 
            gradientText 4s linear infinite,
            fullMotion 4s linear infinite;
          
          transform-origin: center center;
          will-change: transform, filter;
          z-index: 1;
        }

        /* Стили снежинок с двойной анимацией */
        .snowflake {
          position: absolute;
          top: -10%;
          color: #fff;
          font-size: 1.3em;
          font-family: Arial, sans-serif;
          text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
          user-select: none;
          cursor: default;
          z-index: 10;
          
          /* Применяем падение (8s) и покачивание (3s) */
          animation-name: snowflakes-fall, snowflakes-shake;
          animation-duration: 8s, 3s;
          animation-timing-function: linear, ease-in-out;
          animation-iteration-count: infinite, infinite;
          animation-play-state: running, running;
        }

        /* Настройка задержек и разброса по ширине */
        .snowflake:nth-of-type(1) { left: 5%;  animation-delay: 0s, 0s; }
        .snowflake:nth-of-type(2) { left: 15%; animation-delay: -2s, -1s; }
        .snowflake:nth-of-type(3) { left: 28%; animation-delay: -5s, -0.5s; }
        .snowflake:nth-of-type(4) { left: 40%; animation-delay: -1s, -2s; }
        .snowflake:nth-of-type(5) { left: 52%; animation-delay: -6s, -1.5s; }
        .snowflake:nth-of-type(6) { left: 65%; animation-delay: -3s, -2.5s; }
        .snowflake:nth-of-type(7) { left: 78%; animation-delay: -7s, -1s; }
        .snowflake:nth-of-type(8) { left: 88%; animation-delay: -4s, -0.5s; }
        .snowflake:nth-of-type(9) { left: 95%; animation-delay: -1.5s, -2s; }
      </style>

      <div class="container">

        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>


        <h1 class="gradient-text">Iliyev Alisher</h1>
      </div>
    </div>
  </foreignObject>
</svg>
