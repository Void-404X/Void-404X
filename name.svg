<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e01cd5">
        <animate attributeName="stop-color" values="#e01cd5;#1fddff;#7928ca;#ff0080;#e01cd5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1fddff">
        <animate attributeName="stop-color" values="#1fddff;#7928ca;#ff0080;#e01cd5;#1fddff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#e01cd5;#1fddff;#7928ca;#ff0080" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#e01cd5" flood-opacity="0.75">
        <animate attributeName="flood-color" values="#e01cd5;#1fddff;#7928ca;#1fddff;#e01cd5" dur="4s" repeatCount="indefinite"/>
      </feDropShadow>
    </filter>
  </defs>

  <!-- Снежинки -->
  <text x="80" y="0" font-size="14" fill="#fff" opacity="0.9">❄
    <animate attributeName="y" from="-10" to="230" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 80 0" to="360 80 0" dur="4s" begin="0s" repeatCount="indefinite" additive="sum"/>
  </text>
  <text x="200" y="0" font-size="20" fill="#fff" opacity="0.9">❄
    <animate attributeName="y" from="-10" to="230" dur="4s" begin="-1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 200 0" to="360 200 0" dur="4s" begin="-1.5s" repeatCount="indefinite" additive="sum"/>
  </text>
  <text x="360" y="0" font-size="12" fill="#fff" opacity="0.9">❄
    <animate attributeName="y" from="-10" to="230" dur="4s" begin="-0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-0.7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 360 0" to="360 360 0" dur="4s" begin="-0.7s" repeatCount="indefinite" additive="sum"/>
  </text>
  <text x="560" y="0" font-size="18" fill="#fff" opacity="0.9">❄
    <animate attributeName="y" from="-10" to="230" dur="4s" begin="-2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-2.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 560 0" to="360 560 0" dur="4s" begin="-2.2s" repeatCount="indefinite" additive="sum"/>
  </text>
  <text x="700" y="0" font-size="15" fill="#fff" opacity="0.9">❄
    <animate attributeName="y" from="-10" to="230" dur="4s" begin="-3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="-3.1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 700 0" to="360 700 0" dur="4s" begin="-3.1s" repeatCount="indefinite" additive="sum"/>
  </text>

  <!-- Текст -->
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="64" fill="url(#grad)" filter="url(#glow)">
    Iliyev Alisher
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 -14; 0 -10; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" additive="sum"/>
  </text>
</svg>
